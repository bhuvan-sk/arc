<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#0f0f11; }
  * { box-sizing:border-box; }
  a { color:#3b6fe5; text-decoration:none; }
  a:hover { color:#6d95ee; }
  @keyframes nodeIn { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
  @keyframes drawIn { from { stroke-dashoffset:1; } to { stroke-dashoffset:0; } }
  @keyframes popIn { from { opacity:0; transform:scale(.6); } to { opacity:1; transform:scale(1); } }
  @keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
</style>
</helmet>

<div style="height:100vh;display:flex;flex-direction:column;background:#0f0f11;font-family:Inter,-apple-system,Helvetica,sans-serif;color:#f2f2f4;overflow:hidden">

  <div style="flex:none;height:48px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 12px;background:#111113;border-bottom:1px solid #1d1d21">
    <div style="display:flex;align-items:center;gap:10px;min-width:200px">
      <div style="width:24px;height:24px;border-radius:8px;background:#23232a;border:1px solid #32323c;display:flex;align-items:center;justify-content:center">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#c9c9d2" stroke-width="1.4" stroke-linejoin="round"><path d="M8 2l6 3-6 3-6-3z"></path><path d="M2 8l6 3 6-3"></path></svg>
      </div>
      <span style="font-size:13px;font-weight:600;letter-spacing:-.1px">payments-platform</span>
      <span style="font-size:13px;color:#6f6f79">/ architecture</span>
    </div>

    <div style="display:flex;align-items:center;gap:2px;padding:3px;background:#17171a;border:1px solid #26262c;border-radius:10px">
      <sc-for list="{{ modes }}" as="m" hint-placeholder-count="3">
        <button style="{{ m.style }}" onClick="{{ m.on }}">{{ m.label }}</button>
      </sc-for>
    </div>

    <div style="display:flex;align-items:center;gap:8px;justify-content:flex-end;min-width:200px">
      <span style="font-size:11px;color:#5f5f68;letter-spacing:.2px;padding-right:2px">⌘K to search</span>
      <button style="height:30px;padding:0 12px;border-radius:8px;background:transparent;border:1px solid #2e2e36;color:#d6d6dd;font-size:12.5px;font-weight:500;font-family:inherit;cursor:pointer" style-hover="border-color:#43434e;color:#fff">Share</button>
      <button style="height:30px;padding:0 12px;border-radius:8px;background:#3b6fe5;border:1px solid #3b6fe5;color:#fff;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:6px" style-hover="background:#4a7cf0;border-color:#4a7cf0" onClick="{{ openChat }}">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M8 2.5l1.4 3.1L12.5 7 9.4 8.4 8 11.5 6.6 8.4 3.5 7l3.1-1.4z"></path><path d="M12.4 10.8l.6 1.3 1.3.6-1.3.6-.6 1.3-.6-1.3-1.3-.6 1.3-.6z"></path></svg>
        Explain with AI
      </button>
      <button style="width:30px;height:30px;border-radius:8px;background:transparent;border:none;color:#8d8d97;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:#1c1c21;color:#e5e5ea">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M2.5 3.5h11v7H8l-3.2 2.7V10.5H2.5z"></path></svg>
      </button>
      <button style="{{ panelBtnStyle }}" onClick="{{ toggleChat }}">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M2.5 3h11v10h-11z"></path><path d="M10 3v10"></path></svg>
      </button>
    </div>
  </div>

  <div style="flex:1;display:flex;min-height:0">

    <sc-if value="{{ showDoc }}" hint-placeholder-val="{{ true }}">
      <div style="{{ docStyle }}">
        <div style="max-width:560px;animation:fadeUp .4s ease both">
          <div style="font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#6a6a74;font-weight:600">{{ docKicker }}</div>
          <h1 style="margin:10px 0 0;font-size:26px;line-height:1.2;font-weight:600;letter-spacing:-.4px">{{ docTitle }}</h1>
          <p style="margin:16px 0 0;font-size:14.5px;line-height:1.7;color:#a9a9b3;text-wrap:pretty">{{ docBody }}</p>
          <div style="margin-top:28px;display:flex;flex-direction:column;gap:1px">
            <sc-for list="{{ docItems }}" as="d" hint-placeholder-count="4">
              <div style="display:flex;align-items:baseline;gap:10px;padding:11px 0;border-top:1px solid #1c1c21">
                <span style="width:7px;height:7px;border-radius:2px;flex:none;background:{{ d.color }};transform:translateY(-1px)"></span>
                <span style="font-size:13.5px;font-weight:600;min-width:130px">{{ d.title }}</span>
                <span style="font-size:13px;color:#7e7e88">{{ d.sub }}</span>
              </div>
            </sc-for>
          </div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ showCanvas }}" hint-placeholder-val="{{ true }}">
      <div style="position:relative;flex:1;min-width:0;background:#0f0f11;overflow:hidden">

        <sc-if value="{{ showGrid }}" hint-placeholder-val="{{ true }}">
          <div style="position:absolute;inset:0;background-image:radial-gradient(#ffffff0d 1px,transparent 1px);background-size:28px 28px"></div>
        </sc-if>

        <svg width="100%" height="100%" viewBox="{{ viewBox }}" preserveAspectRatio="xMidYMid meet" style="position:absolute;inset:0">
          <defs>
            <filter id="nodeShadow" x="-40%" y="-40%" width="180%" height="180%">
              <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.55"></feDropShadow>
            </filter>
            <marker id="ar-db" viewBox="0 0 7 7" refX="6" refY="3.5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0.5L6 3.5L0 6.5z" fill="#4c8df6"></path></marker>
            <marker id="ar-svc" viewBox="0 0 7 7" refX="6" refY="3.5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0.5L6 3.5L0 6.5z" fill="#a273f2"></path></marker>
            <marker id="ar-queue" viewBox="0 0 7 7" refX="6" refY="3.5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0.5L6 3.5L0 6.5z" fill="#e05fb0"></path></marker>
            <marker id="ar-infra" viewBox="0 0 7 7" refX="6" refY="3.5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0.5L6 3.5L0 6.5z" fill="#46b980"></path></marker>
            <marker id="ar-ext" viewBox="0 0 7 7" refX="6" refY="3.5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0.5L6 3.5L0 6.5z" fill="#8d949e"></path></marker>
          </defs>

          <g transform="{{ zoomTransform }}">
            <sc-for list="{{ bands }}" as="b" hint-placeholder-count="3">
              <foreignObject x="{{ b.x }}" y="{{ b.y }}" width="400" height="20" opacity="{{ b.op }}">
                <div style="font-family:Inter,sans-serif;font-size:12px;font-weight:600;letter-spacing:1.6px;color:{{ b.color }}">{{ b.label }}</div>
              </foreignObject>
            </sc-for>

            <sc-for list="{{ edges }}" as="e" hint-placeholder-count="6">
              <path d="{{ e.d }}" fill="none" stroke="{{ e.color }}" stroke-width="1.6" stroke-linecap="round" opacity="{{ e.op }}" marker-end="{{ e.marker }}" pathLength="1" stroke-dasharray="1" style="{{ e.style }}"></path>
            </sc-for>

            <sc-for list="{{ steps }}" as="s" hint-placeholder-count="4">
              <g opacity="{{ s.op }}" style="{{ s.style }}">
                <circle cx="{{ s.x }}" cy="{{ s.y }}" r="10" fill="{{ s.color }}"></circle>
                <foreignObject x="{{ s.bx }}" y="{{ s.by }}" width="20" height="20">
                  <div style="width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-family:Inter,sans-serif;font-size:11px;font-weight:700;color:#0f0f11">{{ s.n }}</div>
                </foreignObject>
              </g>
            </sc-for>

            <sc-for list="{{ nodes }}" as="n" hint-placeholder-count="4">
              <g transform="{{ n.t }}" opacity="{{ n.op }}" style="{{ n.style }}">
                <rect x="0" y="0" width="220" height="62" rx="10" fill="{{ n.tint }}" stroke="{{ n.color }}" stroke-width="1.5" filter="url(#nodeShadow)"></rect>
                <path d="{{ n.icon }}" transform="translate(16,23)" fill="none" stroke="{{ n.color }}" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path>
                <foreignObject x="46" y="13" width="164" height="40">
                  <div style="font-family:Inter,sans-serif;display:flex;flex-direction:column;gap:3px">
                    <div style="font-size:14px;font-weight:600;color:#f2f2f4;letter-spacing:-.1px;white-space:nowrap">{{ n.title }}</div>
                    <div style="font-size:12px;color:#82828c;white-space:nowrap">{{ n.sub }}</div>
                  </div>
                </foreignObject>
              </g>
            </sc-for>
          </g>
        </svg>

        <div style="position:absolute;left:16px;top:16px;z-index:6;display:flex;flex-direction:column;gap:2px;padding:6px;background:#161619;border:1px solid #26262c;border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.5)">
          <sc-for list="{{ toolsA }}" as="t" hint-placeholder-count="3">
            <button style="{{ t.style }}" onClick="{{ t.on }}" title="{{ t.name }}">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="{{ t.icon }}"></path></svg>
              <span style="font-size:9px;color:#63636d;font-weight:600;letter-spacing:.3px">{{ t.key }}</span>
            </button>
          </sc-for>
          <div style="height:1px;background:#26262c;margin:7px 4px"></div>
          <sc-for list="{{ toolsB }}" as="t" hint-placeholder-count="4">
            <button style="{{ t.style }}" onClick="{{ t.on }}" title="{{ t.name }}">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="{{ t.icon }}"></path></svg>
              <span style="font-size:9px;color:#63636d;font-weight:600;letter-spacing:.3px">{{ t.key }}</span>
            </button>
          </sc-for>
        </div>

        <div style="position:absolute;right:16px;top:16px;z-index:6">
          <button style="height:32px;padding:0 10px;display:flex;align-items:center;gap:7px;background:#161619;border:1px solid #26262c;border-radius:10px;box-shadow:0 8px 22px rgba(0,0,0,.45);color:#c8c8d1;font-size:12px;font-weight:500;font-family:inherit;cursor:pointer" style-hover="border-color:#3a3a44" onClick="{{ toggleZoom }}">
            {{ zoomLabel }}
            <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5L8 10.5L12 6.5"></path></svg>
          </button>
          <sc-if value="{{ zoomOpen }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute;right:0;top:38px;width:118px;padding:5px;background:#161619;border:1px solid #26262c;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:1px">
              <sc-for list="{{ zoomOptions }}" as="z" hint-placeholder-count="5">
                <button style="{{ z.style }}" onClick="{{ z.on }}">{{ z.label }}</button>
              </sc-for>
            </div>
          </sc-if>
        </div>

        <div style="position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:6px;padding:6px;background:#161619;border:1px solid #26262c;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.55)">
          <div style="position:relative">
            <button style="height:32px;padding:0 11px;display:flex;align-items:center;gap:8px;white-space:nowrap;flex:none;background:transparent;border:1px solid #2b2b33;border-radius:8px;color:#d6d6dd;font-size:12.5px;font-weight:500;font-family:inherit;cursor:pointer" style-hover="border-color:#3d3d48" onClick="{{ toggleLayers }}">
              <span style="width:8px;height:8px;border-radius:3px;background:{{ activeColor }}"></span>
              {{ activeLayerLabel }}
              <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="#8d8d97" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5L8 10.5L12 6.5"></path></svg>
            </button>
            <sc-if value="{{ layerOpen }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;left:0;bottom:40px;width:216px;padding:5px;background:#161619;border:1px solid #26262c;border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.65);display:flex;flex-direction:column;gap:1px">
                <sc-for list="{{ layerOptions }}" as="l" hint-placeholder-count="3">
                  <button style="{{ l.style }}" onClick="{{ l.on }}">
                    <span style="width:8px;height:8px;border-radius:3px;flex:none;background:{{ l.dot }}"></span>
                    <span style="flex:1;text-align:left">{{ l.label }}</span>
                    <span style="font-size:11px;color:#5f5f69">{{ l.meta }}</span>
                  </button>
                </sc-for>
              </div>
            </sc-if>
          </div>

          <button style="{{ nextStyle }}" onClick="{{ nextLayer }}">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v7"></path><path d="M5 6.2L8 9.4l3-3.2"></path><path d="M2.5 12.5h11"></path></svg>
            {{ nextLabel }}
            <span style="font-size:10.5px;color:#7b7b86;font-weight:600;padding-left:2px">⇧N</span>
          </button>

          <div style="width:1px;height:22px;background:#26262c;margin:0 2px"></div>

          <button style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid #2b2b33;border-radius:8px;color:#c0c0c9;cursor:pointer" style-hover="border-color:#3d3d48;color:#fff" title="Regenerate layer" onClick="{{ regenerate }}">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13.2 8a5.2 5.2 0 11-1.6-3.7"></path><path d="M13.4 2.2v3h-3"></path></svg>
          </button>
          <button style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid #2b2b33;border-radius:8px;color:#c0c0c9;cursor:pointer" style-hover="border-color:#3d3d48;color:#fff" title="More">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><circle cx="4" cy="8" r="1.3"></circle><circle cx="8" cy="8" r="1.3"></circle><circle cx="12" cy="8" r="1.3"></circle></svg>
          </button>
        </div>

        <button style="position:absolute;right:16px;bottom:20px;z-index:6;width:34px;height:34px;border-radius:10px;background:#161619;border:1px solid #26262c;box-shadow:0 10px 26px rgba(0,0,0,.5);color:#9a9aa4;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer" style-hover="color:#fff;border-color:#3a3a44">?</button>

        <sc-if value="{{ chatOpen }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;right:16px;top:62px;bottom:70px;width:316px;z-index:7;display:flex;flex-direction:column;background:#161619;border:1px solid #26262c;border-radius:10px;box-shadow:0 16px 40px rgba(0,0,0,.6);animation:fadeUp .25s ease both">
            <div style="flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 13px;border-bottom:1px solid #23232a">
              <span style="font-size:12.5px;font-weight:600">{{ chatTitle }}</span>
              <button style="width:24px;height:24px;border-radius:8px;background:transparent;border:none;color:#8d8d97;cursor:pointer;font-size:14px;font-family:inherit;line-height:1" style-hover="background:#1f1f25;color:#fff" onClick="{{ toggleChat }}">×</button>
            </div>
            <div style="flex:1;padding:13px;overflow:auto;display:flex;flex-direction:column;gap:12px">
              <div style="font-size:13px;line-height:1.65;color:#b6b6c0;background:#1b1b21;border:1px solid #24242b;border-radius:10px;padding:11px 12px;text-wrap:pretty">{{ chatBody }}</div>
              <div style="font-size:11px;color:#5f5f69;letter-spacing:.2px">{{ chatScope }}</div>
            </div>
            <div style="flex:none;padding:10px;border-top:1px solid #23232a">
              <div style="display:flex;align-items:center;gap:8px;height:34px;padding:0 11px;background:#111114;border:1px solid #2a2a32;border-radius:10px">
                <span style="font-size:12.5px;color:#5c5c66">Ask about this layer…</span>
              </div>
            </div>
          </div>
        </sc-if>

      </div>
    </sc-if>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#3b6fe5&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#3b6fe5&quot;,&quot;#5b7cf0&quot;,&quot;#2f6ad0&quot;,&quot;#4c8df6&quot;],&quot;section&quot;:&quot;Theme&quot;},&quot;showGrid&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Canvas&quot;},&quot;lockedLayers&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dim&quot;,&quot;hide&quot;],&quot;default&quot;:&quot;dim&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Canvas&quot;}}">
class Component extends DCLogic {
  state = { mode: 'Both', tool: 'select', active: 0, unlocked: 0, zoom: 100, zoomOpen: false, layerOpen: false, chatOpen: false, hidden: false, animLayer: 0 };

  componentDidMount() { this.settle(); }

  settle() {
    clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ animLayer: -1 }), 1200);
  }

  reveal(i) { this.setState({ animLayer: i }); this.settle(); }

  W = 220; H = 62; COLS = [150, 440, 730];

  TYPE = { db: '#4c8df6', svc: '#a273f2', queue: '#e05fb0', infra: '#46b980', ext: '#8d949e' };

  ICON = {
    db: 'M8 2c3.3 0 6 .9 6 2s-2.7 2-6 2-6-.9-6-2 2.7-2 6-2z M2 4v8c0 1.1 2.7 2 6 2s6-.9 6-2V4 M14 8c0 1.1-2.7 2-6 2s-6-.9-6-2',
    svc: 'M6 2.5L2.5 8L6 13.5 M10 2.5L13.5 8L10 13.5',
    queue: 'M2.5 4.5h11 M2.5 8h11 M2.5 11.5h7',
    infra: 'M2.5 3h11v4.2h-11z M2.5 8.8h11V13h-11z M5 5.1h1 M5 10.9h1',
    ext: 'M7.5 3H3v10h10V8.5 M9.5 2.5h4v4 M13.5 2.5L7.8 8.2'
  };

  LAYERS = [
    { id: 'data', name: 'Data', label: 'LAYER 01 — DATA', y: 110,
      doc: 'Every order write lands on a single Postgres primary. Logical replication publishes row-level changes to the stream, which fans them out to the warehouse. Nothing else writes to the primary.',
      chat: 'The data layer has one authoritative writer. Postgres holds order state, the change stream carries committed rows downstream, and the warehouse is a read-only consumer.',
      nodes: [
        { id: 'pg', col: 0, type: 'db', title: 'Postgres 16', sub: 'primary order store' },
        { id: 'cdc', col: 1, type: 'queue', title: 'Change Stream', sub: 'logical replication' },
        { id: 'wh', col: 2, type: 'db', title: 'Snowflake', sub: 'analytics warehouse' }
      ],
      edges: [{ a: 'pg', b: 'cdc', n: 1 }, { a: 'cdc', b: 'wh', n: 2 }] },

    { id: 'api', name: 'API', label: 'LAYER 02 — API', y: 400,
      doc: 'One gateway fronts every request. It terminates auth and rate limits before handing off to Ledger, which writes double-entry records and settles against Stripe. Ledger is the only service holding write credentials for Postgres.',
      chat: 'The gateway is the only public surface. Ledger serialises writes and owns the Postgres connection pool. Settlement calls to Stripe are idempotent and retried out-of-band, so a provider timeout never blocks checkout.',
      nodes: [
        { id: 'gw', col: 0, type: 'svc', title: 'Edge Gateway', sub: 'auth + rate limits' },
        { id: 'ledger', col: 1, type: 'svc', title: 'Ledger API', sub: 'double-entry writes' },
        { id: 'stripe', col: 2, type: 'ext', title: 'Stripe', sub: 'payments provider' }
      ],
      edges: [{ a: 'gw', b: 'ledger', n: 1 }, { a: 'ledger', b: 'stripe', n: 2 }, { a: 'ledger', b: 'pg' }] },

    { id: 'infra', name: 'Infra', label: 'LAYER 03 — INFRA', y: 690,
      doc: 'Everything runs on one EKS cluster fronted by Fastly. Traces, metrics and logs ship to Grafana Cloud with thirty-day retention, and every pod pulls short-lived credentials rather than static env vars.',
      chat: 'One region, three availability zones. Fastly absorbs TLS and caching before traffic reaches the cluster. The gateway is the only workload with an ingress route; everything else is cluster-internal.',
      nodes: [
        { id: 'fastly', col: 0, type: 'infra', title: 'Fastly Edge', sub: 'TLS, cache, WAF' },
        { id: 'eks', col: 1, type: 'infra', title: 'EKS us-east-1', sub: '12 nodes, 3 AZs' },
        { id: 'obs', col: 2, type: 'infra', title: 'Grafana Cloud', sub: 'metrics, traces, logs' }
      ],
      edges: [{ a: 'fastly', b: 'eks', n: 1 }, { a: 'eks', b: 'obs', n: 2 }, { a: 'eks', b: 'gw' }] }
  ];

  tint(c) { return c + '14'; }

  nodeGeom() {
    const map = {};
    this.LAYERS.forEach((L, li) => L.nodes.forEach(n => {
      map[n.id] = { ...n, li, x: this.COLS[n.col], y: L.y, color: this.TYPE[n.type] };
    }));
    return map;
  }

  layerOpacity(i) {
    const hideLocked = (this.props.lockedLayers ?? 'dim') === 'hide';
    if (i === this.state.active) return 1;
    if (i <= this.state.unlocked) return 0.24;
    return hideLocked ? 0 : 0.06;
  }

  route(a, b) {
    if (Math.abs(a.y - b.y) < 1) return `M${a.x} ${a.y} H${b.x}`;
    const mid = (a.y + b.y) / 2, r = 12;
    const s = Math.sign(b.x - a.x) || 1, v = Math.sign(b.y - a.y);
    if (Math.abs(b.x - a.x) < 2) return `M${a.x} ${a.y} V${b.y}`;
    return `M${a.x} ${a.y} V${mid - r * v} Q${a.x} ${mid} ${a.x + s * r} ${mid} H${b.x - s * r} Q${b.x} ${mid} ${b.x} ${mid + r * v} V${b.y}`;
  }

  toolBtn(active) {
    return {
      width: 40, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2,
      padding: '6px 0 4px', borderRadius: 8, border: 'none', cursor: 'pointer', fontFamily: 'inherit',
      background: active ? '#2e2e36' : 'transparent', color: active ? '#ffffff' : '#9c9ca6'
    };
  }

  menuBtn(active) {
    return {
      display: 'flex', alignItems: 'center', gap: 9, width: '100%', height: 32, padding: '0 9px',
      borderRadius: 8, border: 'none', cursor: 'pointer', fontFamily: 'inherit', fontSize: 12.5,
      background: active ? '#2e2e36' : 'transparent', color: active ? '#ffffff' : '#b4b4be', textAlign: 'left'
    };
  }

  setTool = (t) => this.setState({ tool: t });

  regenerate = () => { this.setState({ hidden: true }); setTimeout(() => { this.setState({ hidden: false }); this.reveal(this.state.active); }, 60); };

  renderVals() {
    const st = this.state;
    const geom = this.nodeGeom();
    const L = this.LAYERS;
    const active = L[st.active];
    const accent = this.props.accent ?? '#3b6fe5';

    const nodes = [], edges = [], steps = [], bands = [];

    L.forEach((layer, li) => {
      const op = this.layerOpacity(li);
      if (op === 0) return;
      const suppress = st.hidden && li === st.active;
      bands.push({ x: this.COLS[0], y: layer.y - 26, label: layer.label, op: op, color: li === st.active ? '#8b8b95' : '#5a5a63' });
      if (suppress) return;
      const anim = li === st.animLayer;
      layer.nodes.forEach(n => {
        const g = geom[n.id];
        nodes.push({ t: `translate(${g.x},${g.y})`, op, color: g.color, tint: this.tint(g.color), icon: this.ICON[n.type], title: n.title, sub: n.sub,
          style: anim ? { animation: 'nodeIn .45s cubic-bezier(.2,.8,.2,1) both' } : {} });
      });
      layer.edges.forEach(e => {
        const A = geom[e.a], B = geom[e.b];
        if (!A || !B) return;
        if (this.layerOpacity(B.li) === 0) return;
        const sameRow = A.y === B.y;
        const from = sameRow ? { x: A.x + this.W, y: A.y + this.H / 2 } : { x: A.x + this.W / 2, y: A.y + (B.y > A.y ? this.H : 0) };
        const to = sameRow ? { x: B.x - 9, y: B.y + this.H / 2 } : { x: B.x + this.W / 2, y: B.y + (B.y > A.y ? -9 : this.H + 9) };
        edges.push({ d: this.route(from, to), color: A.color, marker: `url(#ar-${A.type})`, op,
          style: anim ? { animation: 'drawIn .55s ease .32s both' } : {} });
        if (e.n) {
          const sx = sameRow ? (from.x + to.x) / 2 : from.x + (to.x - from.x) / 2;
          const sy = sameRow ? from.y : (from.y + to.y) / 2;
          steps.push({ x: sx, y: sy, bx: sx - 10, by: sy - 10, n: e.n, color: A.color, op,
            style: anim ? { animation: 'popIn .3s ease .75s both' } : {} });
        }
      });
    });

    const modes = ['Document', 'Both', 'Canvas'].map(label => ({
      label, on: () => this.setState({ mode: label }),
      style: { height: 26, padding: '0 12px', borderRadius: 7, border: 'none', cursor: 'pointer', fontFamily: 'inherit', fontSize: 12, fontWeight: 500, background: st.mode === label ? '#2e2e36' : 'transparent', color: st.mode === label ? '#ffffff' : '#8b8b95' }
    }));

    const toolsA = [
      { id: 'upload', name: 'Upload diagram', key: 'U', icon: 'M8 12.5V3 M4.6 6.4L8 3l3.4 3.4 M2.8 13.4h10.4' },
      { id: 'ai', name: 'Ask AI about this layer', key: 'A', icon: 'M8 2.4l1.5 3.3 3.3 1.5-3.3 1.5L8 12l-1.5-3.3L3.2 7.2l3.3-1.5z M12.6 11l.5 1.2 1.2.5-1.2.5-.5 1.2-.5-1.2-1.2-.5 1.2-.5z' },
      { id: 'export', name: 'Export view', key: 'E', icon: 'M2.8 9.6v3.6h10.4V9.6 M8 2.6v7.2 M5 7l3 3 3-3' }
    ].map(t => ({ name: t.name, key: t.key, icon: t.icon, style: this.toolBtn(st.tool === t.id), on: () => { this.setTool(t.id); if (t.id === 'ai') this.setState({ chatOpen: true }); } }));

    const toolsB = [
      { id: 'select', name: 'Select / pan', key: 'V', icon: 'M4.4 2.6L12 7.4l-3.6 1L7.2 12z' },
      { id: 'fit', name: 'Zoom to fit', key: 'F', icon: 'M3 6.2V3h3.2 M9.8 3H13v3.2 M13 9.8V13H9.8 M6.2 13H3V9.8' },
      { id: 'comment', name: 'Comment', key: 'C', icon: 'M2.6 3.4h10.8v7H8L4.9 13V10.4H2.6z' },
      { id: 'settings', name: 'Canvas settings', key: 'S', icon: 'M8 6a2 2 0 100 4 2 2 0 000-4z M8 2.2v1.6 M8 12.2v1.6 M2.2 8h1.6 M12.2 8h1.6 M4 4l1.1 1.1 M10.9 10.9L12 12 M12 4l-1.1 1.1 M5.1 10.9L4 12' }
    ].map(t => ({ name: t.name, key: t.key, icon: t.icon, style: this.toolBtn(st.tool === t.id), on: () => this.setTool(t.id) }));

    const zoomOptions = [50, 75, 100, 150].map(z => ({
      label: z + '%', on: () => this.setState({ zoom: z, zoomOpen: false }), style: this.menuBtn(st.zoom === z)
    }));
    zoomOptions.push({ label: 'Zoom to fit', on: () => this.setState({ zoom: 100, zoomOpen: false }), style: this.menuBtn(false) });

    const layerOptions = L.map((layer, i) => ({
      label: `Layer 0${i + 1} · ${layer.name}`,
      meta: i <= st.unlocked ? (i === st.active ? 'current' : 'unlocked') : 'locked',
      dot: i <= st.unlocked ? this.TYPE[layer.nodes[0].type] : '#3a3a42',
      style: this.menuBtn(i === st.active),
      on: () => { if (i <= st.unlocked) this.setState({ active: i, layerOpen: false }); }
    }));

    const last = st.unlocked >= L.length - 1;
    const nextStyle = {
      height: 32, padding: '0 12px', display: 'flex', alignItems: 'center', gap: 7, borderRadius: 8,
      border: last ? '1px solid #2b2b33' : '1.5px solid #5c5c6b', background: 'transparent',
      color: last ? '#6d6d77' : '#ffffff', fontSize: 12.5, fontWeight: 600, fontFamily: 'inherit',
      cursor: last ? 'default' : 'pointer', whiteSpace: 'nowrap', flex: 'none'
    };

    const scale = st.zoom / 100;
    const docItems = active.nodes.map(n => ({ title: n.title, sub: n.sub, color: this.TYPE[n.type] }));

    return {
      nodes, edges, steps, bands, modes, toolsA, toolsB, zoomOptions, layerOptions, nextStyle,
      viewBox: `0 ${active.y + this.H / 2 - 260} 1030 520`,
      zoomTransform: `translate(515,${active.y + this.H / 2}) scale(${scale}) translate(-515,${-(active.y + this.H / 2)})`,
      zoomLabel: st.zoom + '%',
      zoomOpen: st.zoomOpen,
      layerOpen: st.layerOpen,
      chatOpen: st.chatOpen,
      showGrid: this.props.showGrid ?? true,
      showDoc: st.mode !== 'Canvas',
      showCanvas: st.mode !== 'Document',
      docStyle: {
        flex: st.mode === 'Document' ? '1 1 0' : '0 0 380px',
        minWidth: 0, padding: st.mode === 'Document' ? '56px 64px' : '40px 36px',
        borderRight: '1px solid #1d1d21', background: '#111113', overflow: 'auto'
      },
      docKicker: `Layer 0${st.active + 1} of 03 · ${active.name}`,
      docTitle: active.name === 'API' ? 'Service boundaries' : active.name === 'Data' ? 'Where state lives' : 'What it runs on',
      docBody: active.doc,
      docItems,
      chatTitle: `Ask AI · ${active.name} layer`,
      chatBody: active.chat,
      activeLayerName: active.name,
      chatScope: `Scoped to the ${active.name} layer · ${active.nodes.length} nodes, ${active.edges.filter(e => active.nodes.some(n => n.id === e.b)).length} flows`,
      activeLayerLabel: `Layer 0${st.active + 1} · ${active.name}`,
      activeColor: this.TYPE[active.nodes[0].type],
      nextLabel: last ? 'All layers revealed' : `Next Layer · ${L[st.unlocked + 1].name}`,
      panelBtnStyle: {
        width: 30, height: 30, borderRadius: 8, border: 'none', cursor: 'pointer',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        background: st.chatOpen ? '#2e2e36' : 'transparent', color: st.chatOpen ? '#ffffff' : '#8d8d97'
      },
      accent,
      toggleZoom: () => this.setState({ zoomOpen: !st.zoomOpen, layerOpen: false }),
      toggleLayers: () => this.setState({ layerOpen: !st.layerOpen, zoomOpen: false }),
      toggleChat: () => this.setState({ chatOpen: !st.chatOpen, zoomOpen: false, layerOpen: false }),
      openChat: () => this.setState({ chatOpen: true, zoomOpen: false, layerOpen: false }),
      regenerate: this.regenerate,
      nextLayer: () => { if (!last) { this.setState({ unlocked: st.unlocked + 1, active: st.unlocked + 1, layerOpen: false }); this.reveal(st.unlocked + 1); } }
    };
  }
}
</script>
